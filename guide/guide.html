/* guide page load */
$(document).ready(function(){
	var dep1Loc;
	$(".g-depth2-name a").on("click",function(e){
        e.preventDefault();
		dep1Loc= $(this).parents(".g-depth1-list").find("h2").html();
		console.log(dep1Loc);
		$(".g-nav .g-depth2-list").removeClass("on");
		$(this).parents(".g-depth2-list").addClass("on");
		$(".g-in-body").load("./"+dep1Loc+"/"+$(this).attr("href")+".html");
        console.log("./"+dep1Loc+"/"+$(this).attr("href")+".html");
	});
	
	$(".g-in-body").load("./Common/headline.html");
});
