<script>
    $(document).ready(function(){
       var scrT = $(document).scrollTop();
       
        $(window).scroll(function(){
            var scrT = $(document).scrollTop();
            if(scrT >= 59) {
                $(".lytSubTop").addClass("sticky");
            } else {
                $(".lytSubTop").removeClass("sticky");
            }
        });

        setTimeout(function(){
            if(scrT >= 59) {
                $(".lytSubTop").addClass("sticky");
            } else {
                $(".lytSubTop").removeClass("sticky");
            }
        },100);
    })
</script>
