        <style>
/* 팝업 */
.popGroup {width:100vw; height:100vh; display:none; position:fixed; left:0; top:0; z-index:6000; box-sizing:border-box;}
.popGroup.on {display:block;}
.popGroup .dim {width:100vw; height:100vh; background:rgba(0,0,0,0.5); position:fixed; left:0; top:0; z-index:1;}
.popGroup .popArea {width: 762px; height: 660px; max-height: calc(100% - 100px); border-radius:15px; background:#fff; overflow:hidden; position: absolute; right: 50%; bottom: 50%; transform: translate(50.6%,50.6%); z-index:2; box-sizing:border-box;}
.popGroup .popTitGroup {  width: 100%;  height: 60px;  border-bottom: solid 1px #e6e6e6;  background:#0098ff;  position: relative; box-sizing:border-box;}
.popGroup .popTitGroup .popTitle { width: 100%; padding: 22px 20px 0; font-size: 17px; font-weight: bold; letter-spacing: -0.6px; text-align: center; color: #fff; box-sizing:border-box;}
.popGroup .popTitGroup .popClose { width: 20px; height: 20px; font-size: 0; border:0; background: url(/images/icon/ico-24-close.svg) center no-repeat; position: absolute; right: 20px; top: 22px; box-sizing:border-box; cursor:pointer;}
.popGroup .popTitGroup .popClose:before {content:""; width:24px; height:2px; background:#fff; transform:rotate(45deg); position:absolute; left:-3px; top:9px}
.popGroup .popTitGroup .popClose:after {content:""; width:24px; height:2px; background:#fff; transform:rotate(-45deg); position:absolute; left:-3px; top:9px}
.popGroup .popContGroup { height: calc(100% - 60px); padding: 30px; overflow: auto; box-sizing:border-box;}
        </style>
